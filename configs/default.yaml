seed: 0

backbone:
  weights: pretrained/resnet18.pth

input:
  size: 256

preprocess:
  keep_aspect: true     # letterbox instead of stretching
  pad_value: 0          # BGR fill for the letterbox bars
  roi:
    enabled: false      # fixed jig box, stored per profile
    x: 0
    y: 0
    width: 0
    height: 0
  align:
    enabled: false      # fixed jig first; enable only if pose varies
    reference: ""       # path to a reference good image
    max_shift_px: 8.0
    max_rotation_deg: 2.0
  denoise:
    enabled: false      # off by default: blur can erase small defects
    method: median      # median | bilateral
    ksize: 3
    d: 5
    sigma_color: 25.0
    sigma_space: 25.0
  illumination:
    enabled: false      # benchmark before enabling
    method: background  # background | exposure | gamma | clahe
    sigma: 40.0
    target: 128.0       # exposure method: background level after correction
    gamma: 1.0
    clip_limit: 2.0
    tile_grid: 8

embedding:
  d: 100          # selected channels out of 448 (64 + 128 + 256)
  pool: 2         # 64x64 fused map -> 32x32 = 1024 positions

algo:
  name: padim
  padim:
    eps: 0.01

train:
  augment_factor: 4
  augment:
    shift: 0.03
    rot_deg: 3.0
    brightness: 0.10
    contrast: 0.10
    flip: false
  batch_size: 16

calibration:
  kfold: 5
  sigma_k: 3.0
  review_margin: 1.15

anomaly_map:
  sigma: 4
  image_score: max   # max | topk
  topk_frac: 0.01

quality:
  enabled: true      # run_validation.py forces false for MVTec
  check_foreground: true
  require_same_size: true

runtime:
  threads: auto
