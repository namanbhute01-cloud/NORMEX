# 192x192 production config + exposure normalisation.
#
# Why: the official MVTec screw split was captured with different exposure for
# train/good and the test groups (test-good background ~170, defects ~186 on a
# 0-255 scale).  A frozen ImageNet backbone scores the darker good images as
# anomalous, which costs real accuracy.  `illumination.method: exposure`
# rescales each image so its border background sits at `target`, removing
# global lighting drift without touching hue, so discolouration defects are
# still visible.
#
# input 192 keeps layer1 at a 48x48 patch grid and meets the < 1000 ms P95
# gate on the 2-core Celeron reference machine.  Train and inspect with the
# SAME config: the profile is hash-locked.

seed: 0

backbone:
  weights: pretrained/resnet18.pth

input:
  size: 192

preprocess:
  keep_aspect: true
  pad_value: 0
  roi:
    enabled: false
    x: 0
    y: 0
    width: 0
    height: 0
  align:
    enabled: false
    reference: ""
    max_shift_px: 8.0
    max_rotation_deg: 2.0
  denoise:
    enabled: false
    method: median
    ksize: 3
    d: 5
    sigma_color: 25.0
    sigma_space: 25.0
  illumination:
    enabled: true
    method: exposure
    sigma: 40.0
    target: 128.0
    gamma: 1.0
    clip_limit: 2.0
    tile_grid: 8

embedding:
  d: 100
  pool: 1

algo:
  name: padim
  padim:
    eps: 0.01

train:
  augment_factor: 0
  augment:
    shift: 0.03
    rot_deg: 3.0
    brightness: 0.10
    contrast: 0.10
    flip: false
  batch_size: 4

calibration:
  kfold: 3
  sigma_k: 3.0
  review_margin: 1.15

anomaly_map:
  sigma: 3
  image_score: max
  topk_frac: 0.01

quality:
  enabled: true
  check_foreground: true
  require_same_size: true

runtime:
  threads: auto
