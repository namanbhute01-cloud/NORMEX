services:
  normex:
    build: .
    image: normex:latest
    container_name: normex
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      # Leave empty to use configs/camera.json (connect once from the intro page)
      NORMEX_CAMERA_URL: "${NORMEX_CAMERA_URL:-}"
      NORMEX_SNAPSHOT_URL: "${NORMEX_SNAPSHOT_URL:-}"
      OMP_NUM_THREADS: "2"
    volumes:
      - ./datasets:/app/datasets
      - ./profiles:/app/profiles
      - ./results:/app/results
      - ./configs:/app/configs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
